services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jdgap
      POSTGRES_PASSWORD: jdgap
      POSTGRES_DB: jdgap
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jdgap:jdgap@db:5432/jdgap
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - db

volumes:
  pgdata: